<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificação Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

        <header class="card-header">
            <h2>
                <img src="usuario.png" alt="Ícone usuário" class="icone-usuario">
                Classificação Idade
            </h2>
        </header>

        <div class="card-body">
            <h4 class="descricao">Digite sua idade para saber em qual faixa etária você se encontra.</h4>
            
            <label for="idade">Digite sua idade :</label>
            <input type="number" id="idade" placeholder="Ex: 18">

            <button id="btnclassificar">Classificar</button>

            <input type="text" id="resultado" placeholder="Resultado aparecerá aqui" readonly>
            
            <hr>
            
            <div id="Classificacao">
                <h4>Faixa Etária:</h4>
                <p>0 a 5 anos &rArr; <strong>Bebê</strong></p>
                <p>6 a 11 anos &rArr; <strong>Criança</strong></p>
                <p>12 a 17 anos &rArr; <strong>Adolescente</strong></p>
                <p>18 a 59 anos &rArr; <strong>Adulto</strong></p>
                <p>60 anos ou mais &rArr; <strong>Idoso</strong></p>
            </div> 
        </div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
